# Общий LLM-шлюз: LiteLLM + Postgres (данные платформы) + Redis (счётчики LB + кэш).
# Деплой: отдельный LXC на сервере, доступ только по LAN. Dev: Docker Desktop на Mac.

services:
  litellm:
    # Пин на конкретный релиз, не :latest и не :main-stable (rolling, deprecated).
    # Апдейт — смена тега здесь + git pull на LXC + docker compose pull && up -d.
    image: ghcr.io/berriai/litellm:v1.100.0
    restart: unless-stopped
    ports:
      # LAN-only: LXC без публичного IP. Если нужно жёстко ограничить интерфейсом —
      # замени на "<lan-ip>:4000:4000". Наружу НЕ публиковать (только через reverse-proxy с TLS).
      - "4000:4000"
    env_file: .env
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml:ro
      # OSS-обход per-key: Enterprise metadata.guardrails даёт 403, см. хук
      - ./hooks/openwebui_presidio.py:/app/openwebui_presidio.py:ro
    mem_limit: 1536m       # 512m/1g → OOM (exit 137) на старте LiteLLM; выросло после подключения Langfuse-коллбэка
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy
    healthcheck:
      # в образе нет curl — проверяем питоном, он точно есть
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - pg_data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # requirepass — пароль; maxmemory + LRU, чтобы кэш не разъедал RAM LXC
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Presidio: детектор и маскировщик ПДн для LiteLLM Guardrails.
  # Порты наружу НЕ публикуем — только docker-сеть. Политика (какой ключ
  # маскировать) живёт в UI/Postgres, не в YAML.
  presidio-analyzer:
    # База GHCR + слой RU-recognizers (ИНН/СНИЛС/паспорт/ФИО). Сборка на месте.
    build:
      context: ./presidio
      dockerfile: Dockerfile
    image: llm-gateway/presidio-analyzer-ru:2.2.364
    restart: unless-stopped
    mem_limit: 1536m       # spaCy en_core_web_* на старте жрёт гигабайт+
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s    # модель NER поднимается не мгновенно

  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:2.2.364
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pg_data:
  redis_data:
