# ──────────────────────────────────────────────────────────────────────────
# Конфиг LiteLLM — только настройки маршрутизации и общие параметры.
# Модели управляются через UI/API (store_model_in_db: true) и хранятся в Postgres.
# Этот файл НЕ содержит model_list — чтобы не было конфликта с UI-моделями.
#
# ВАЖНО: процесс читает этот файл ОДИН раз при старте.
#        после правки yaml → `docker compose restart litellm`.
#        после правки .env (ключи Langfuse) → `docker compose up -d litellm`
#        (`restart` оставляет старый env в контейнере).
# ──────────────────────────────────────────────────────────────────────────

router_settings:
  # выбирает источник с запасом по rpm/tpm (нужен Redis); так размазывается упор в лимит провайдера
  routing_strategy: usage-based-routing-v2
  redis_host: redis
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD

  num_retries: 3            # повторов на одном источнике (с backoff, уважает Retry-After)
  timeout: 120              # секунд на запрос
  allowed_fails: 3          # после стольких сбоев источник уходит в cooldown
  cooldown_time: 30         # на сколько секунд выводим упавший источник из ротации

  # если основной провайдер недоступен — переключаемся на резервный
  # deepseek-v4-flash-fallback (app.provod.ai) — аварийный провайдер без VPN из РФ.
  # Стоит последним звеном у ВСЕХ моделей: если упадёт и основной, и его обычный
  # резерв (например, отвалится VPN и станут недоступны OpenRouter/DeepSeek official),
  # запрос всё равно уйдёт через provod.ai. Сам он никуда дальше не фолбэчит —
  # это конечная точка отказоустойчивости.
  #
  # ЭТОТ БЛОК ИГНОРИРУЕТСЯ, пока в таблице Postgres LiteLLM_Config есть строка
  # param_name='router_settings' — она полностью подменяет router_settings из
  # этого файла при каждом старте процесса, включая fallbacks (ключ заменяется
  # целиком, а не мёржится). Редактируется через UI → Router Settings, без
  # перезапуска контейнера. Ниже — просто зеркало последнего известного
  # DB-состояния, нужное как отправная точка при восстановлении БД с нуля.
  # Проверить живое значение:
  #   docker exec -e PGPASSWORD=... <postgres-container> psql -U litellm -d litellm \
  #     -c "SELECT param_value FROM \"LiteLLM_Config\" WHERE param_name='router_settings';"
  fallbacks:
    - gpt-4.1-mini: ["gpt-4.1-mini-fallback", "deepseek-v4-flash-fallback"]   # OpenRouter → nano-gpt → provod.ai
    - gpt-4.1-mini-fallback: ["gpt-4.1-mini", "deepseek-v4-flash-fallback"]   # nano-gpt → OpenRouter → provod.ai
    - deepseek/deepseek-flash: ["deepseek-v4-flash-latest", "deepseek-v4-flash-fallback"]  # DeepSeek official → OpenRouter → provod.ai
    - deepseek-v4-flash-latest: ["deepseek-v4-flash-fallback"]                # OpenRouter → provod.ai
  # переключение при переполнении контекста (пример; включи, когда добавишь модель с большим окном):
  # context_window_fallbacks:
  #   - gpt-4.1-mini: ["gpt-4.1"]

litellm_settings:
  drop_params: true         # тихо отбрасывать неподдерживаемые провайдером параметры
  # трейсинг всех вызовов в Langfuse v3/v4 через OTLP (не legacy SDK 2.x).
  # OTEL: {LANGFUSE_HOST}/api/public/otel, ключи LANGFUSE_PUBLIC_KEY/SECRET_KEY из .env.
  # После правки yaml — restart; после смены ключей в .env — up -d.
  callbacks:
    - prometheus
    - openwebui_presidio.proxy_handler_instance
    - langfuse_key_alias_tag.proxy_handler_instance  # короткий тег клиента + session/user OpenWebUI
    - langfuse_otel_quiet.proxy_handler_instance  # не слать пустые GUARDRAIL/raw_gen_ai спаны
    - langfuse_otel
  # langfuse_default_tags — только legacy callback, OTEL его не читает. Теги
  # ставит хук: openclaw / openwebui / ragv2, без префикса user_api_key_alias:.
  # НЕ вешать автотег "User-Agent: ..." на каждый трейс — с litellm 1.73.0 он
  # добавляется по умолчанию и захламляет фильтр по тегам (сотни "User-Agent: OpenAI").
  disable_add_user_agent_to_request_tags: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY  # админ + дефолтный доступ; клиентам раздаём virtual keys
  database_url: os.environ/DATABASE_URL      # Postgres: ключи, бюджеты, история расходов
  store_model_in_db: true                    # модели/ключи можно менять через UI/API без перезапуска

# Guardrails (Presidio) сюда НЕ кладём как источник истины: создаются в UI
# (Guardrails → Presidio PII, default_on=выкл) и вешаются на ключ через
# metadata.guardrails. Иначе как с router_settings — файл разъедется с БД.
